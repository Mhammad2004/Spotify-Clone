<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SignUp - spotify
  </title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="https://open.spotifycdn.com/cdn/images/favicon32.b64ecc03.png" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
</head>

<body class="login-body">
  <div class="login-container">
    <div class="logo"><img src="assets/spotifyLogo.jpg" alt=""></div>
    <h1 class="brand">Sign up to</h1>
    <h2 class="login-title">Start Listening</h2>



    <form class="login-form">
      <label for="">Email address</label>
      <input type="text" placeholder="name@domain.com" required />
      <button type="submit" class="login-submit">Next</button>
    </form>

    <div class="divider"><span>or</span></div>

    <div class="social-buttons">
      <button class="social-btn google">
        <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/google/google-original.svg" alt="Google" /> Sign up
        with Google
      </button>
      <button class="social-btn apple">
        <img src="https://upload.wikimedia.org/wikipedia/commons/f/fa/Apple_logo_black.svg" alt="Apple" /> Sign up with
        Apple
      </button>
    </div>

    <div class="divider"></div>

    <div class="login-footer">
      <span style="font-size: 15px;" href="#">Already have an account? <a href="login.html"> login here</a></span>
      <br><br><br>
      <p style="font-size: 11px;">This site is protected by reCAPTCHA and the Google
        <a href="signup.html">Privacy Policy and Terms of Service</a>apply.
      </p>
    </div>
  </div>
</body>

</html>
